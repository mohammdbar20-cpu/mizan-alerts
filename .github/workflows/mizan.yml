name: Mizan alert

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .mizan-state
          key: mizan-state-${{ github.run_id }}
          restore-keys: |
            mizan-state-
      - name: Check gold and send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NOTIFY_WAIT: "true"
          MIZAN_STATE: .mizan-state
        run: python mizan_engine.py --once
